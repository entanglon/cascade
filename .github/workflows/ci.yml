name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Unit Test
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build Debug Scheme
        run: |
          xcodebuild -configuration Debug \
            -scheme xCloud \
            -destination 'platform=macOS' \
            clean build

      - name: Run Headless Unit Tests
        run: |
          xcodebuild -configuration Debug \
            -scheme xCloud \
            -destination 'platform=macOS' \
            -only-testing:xCloudTests \
            test
