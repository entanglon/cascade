name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE on free-tier minutes: private repos bill macOS runners at 10x the Linux
# multiplier, so this job is intentionally BUILD-ONLY (a few minutes). Run the
# full unit suite locally before pushing:
#   xcodebuild test -project Cascade.xcodeproj -scheme Cascade \
#     -destination 'platform=macOS' -only-testing:CascadeTests
jobs:
  build:
    name: Debug Build (smoke)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      # Uses the runner's default (newest) Xcode — the project requires the
      # Swift 6.3 / macOS 26 SDK era toolchain. Do NOT pin old Xcode versions.
      - name: Build Debug Scheme
        run: |
          xcodebuild -configuration Debug \
            -project Cascade.xcodeproj \
            -scheme Cascade \
            -destination 'platform=macOS' \
            build
